<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Space Grotesk', system-ui, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8f1fb"/>
      <stop offset="100%" stop-color="#f5f8ff"/>
    </linearGradient>

    <!-- Center cube gradient (face) -->
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2f6fd4"/>
      <stop offset="100%" stop-color="#1a3d8f"/>
    </linearGradient>

    <!-- Center cube shine -->
    <linearGradient id="cubeShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1769d5" flood-opacity="0.12"/>
    </filter>
    <filter id="cubeShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1769d5" flood-opacity="0.35"/>
    </filter>
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1769d5" flood-opacity="0.10"/>
    </filter>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c8d8f0" opacity="0.55"/>
    </pattern>

    <!-- Clip for rounded background -->
    <clipPath id="bgClip">
      <rect width="880" height="500" rx="24"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="880" height="500" rx="24" fill="url(#bgGrad)"/>
  <rect width="880" height="500" rx="24" fill="url(#dots)" clip-path="url(#bgClip)"/>

  <!-- ── Concentric rings around center ── -->
  <circle cx="440" cy="250" r="145" fill="none" stroke="#c0d4f0" stroke-width="1" opacity="0.6"/>
  <circle cx="440" cy="250" r="105" fill="none" stroke="#c0d4f0" stroke-width="1" opacity="0.7"/>
  <circle cx="440" cy="250" r="68"  fill="none" stroke="#b8cce8" stroke-width="1.2" opacity="0.8"/>

  <!-- ── Ring orbit dots ── -->
  <circle cx="440" cy="105" r="6.5" fill="#3b82f6" opacity="0.90"/>
  <circle cx="440" cy="395" r="6.5" fill="#3b82f6" opacity="0.90"/>

  <!-- ── Dashed connector lines (center → corners) ── -->
  <!-- to AI ENGINEERING (top-left) -->
  <line x1="400" y1="218" x2="242" y2="148" stroke="#93b8e8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.75"/>
  <circle cx="321" cy="183" r="4.5" fill="#2563eb"/>
  <circle cx="321" cy="183" r="7" fill="#2563eb" opacity="0.2"/>

  <!-- to WEB ARCHITECTURE (top-right) -->
  <line x1="480" y1="218" x2="614" y2="148" stroke="#93b8e8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.75"/>
  <circle cx="547" cy="183" r="4.5" fill="#9333ea"/>
  <circle cx="547" cy="183" r="7" fill="#9333ea" opacity="0.2"/>

  <!-- to APP DEVELOPMENT (bottom-left) -->
  <line x1="400" y1="282" x2="242" y2="354" stroke="#93b8e8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.75"/>
  <circle cx="329" cy="314" r="4.5" fill="#0d9488"/>
  <circle cx="329" cy="314" r="7" fill="#0d9488" opacity="0.2"/>

  <!-- to CLOUD RELIABILITY (bottom-right) -->
  <line x1="480" y1="282" x2="614" y2="354" stroke="#93b8e8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.75"/>
  <circle cx="540" cy="314" r="4.5" fill="#ea580c"/>
  <circle cx="540" cy="314" r="7" fill="#ea580c" opacity="0.2"/>

  <!-- ══════════════════════════════════════════
       CORNER NODES
  ══════════════════════════════════════════ -->

  <!-- ── AI ENGINEERING (top-left) ── -->
  <g filter="url(#nodeShadow)">
    <rect x="80" y="112" width="185" height="62" rx="14" fill="white" stroke="#dde8f8" stroke-width="1.2"/>
  </g>
  <!-- chip icon -->
  <rect x="104" y="130" width="26" height="26" rx="6" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="110" y="136" width="14" height="14" rx="3" fill="#8b5cf6" opacity="0.25"/>
  <line x1="108" y1="137" x2="104" y2="137" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="108" y1="143" x2="104" y2="143" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="108" y1="149" x2="104" y2="149" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="122" y1="130" x2="122" y2="126" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="128" y1="130" x2="128" y2="126" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="122" y1="156" x2="122" y2="160" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="128" y1="156" x2="128" y2="160" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="130" y1="137" x2="134" y2="137" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="130" y1="143" x2="134" y2="143" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="130" y1="149" x2="134" y2="149" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="140" y="136" font-size="11" font-weight="700" fill="#1e293b" letter-spacing="0.3">AI ENGINEERING</text>
  <text x="140" y="150" font-size="10" fill="#64748b">RAG &amp; Agents</text>

  <!-- ── WEB ARCHITECTURE (top-right) ── -->
  <g filter="url(#nodeShadow)">
    <rect x="610" y="112" width="200" height="62" rx="14" fill="white" stroke="#dde8f8" stroke-width="1.2"/>
  </g>
  <!-- globe icon -->
  <circle cx="634" cy="143" r="13" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <ellipse cx="634" cy="143" rx="5" ry="13" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
  <line x1="621" y1="143" x2="647" y2="143" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="654" y="138" font-size="11" font-weight="700" fill="#1e293b" letter-spacing="0.3">WEB ARCHITECTURE</text>
  <text x="654" y="152" font-size="10" fill="#64748b">SSR &amp; Next.js</text>

  <!-- ── APP DEVELOPMENT (bottom-left) ── -->
  <g filter="url(#nodeShadow)">
    <rect x="80" y="330" width="190" height="62" rx="14" fill="white" stroke="#dde8f8" stroke-width="1.2"/>
  </g>
  <!-- mobile icon -->
  <rect x="103" y="344" width="18" height="30" rx="4" fill="none" stroke="#10b981" stroke-width="2"/>
  <line x1="109" y1="370" x2="115" y2="370" stroke="#10b981" stroke-width="1.5"/>
  <text x="130" y="356" font-size="11" font-weight="700" fill="#1e293b" letter-spacing="0.3">APP DEVELOPMENT</text>
  <text x="130" y="370" font-size="10" fill="#64748b">Flutter &amp; RN</text>

  <!-- ── CLOUD RELIABILITY (bottom-right) ── -->
  <g filter="url(#nodeShadow)">
    <rect x="615" y="330" width="190" height="62" rx="14" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <!-- cloud icon -->
  <path d="M638 361 q-3-8 6-10 q2-6 10-5 q6-4 10 2 q6 0 6 7 q0 6-6 6 Z" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="660" y="356" font-size="11" font-weight="700" fill="#1e293b" letter-spacing="0.3">CLOUD RELIABILITY</text>
  <text x="660" y="370" font-size="10" fill="#64748b">Kubernetes</text>

  <!-- ══════════════════════════════════════════
       SIDE LABELS (left)
  ══════════════════════════════════════════ -->
  <!-- SECURE -->
  <g>
    <rect x="62" y="224" width="84" height="28" rx="14" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <!-- shield icon -->
    <path d="M78 231 l4-2 l4 2 v5 q0 3-4 5 q-4-2-4-5 Z" fill="none" stroke="#22c55e" stroke-width="1.4"/>
    <text x="93" y="242" font-size="10" font-weight="700" fill="#16a34a" letter-spacing="0.5">SECURE</text>
  </g>
  <!-- REAL-TIME -->
  <g>
    <rect x="55" y="262" width="100" height="28" rx="14" fill="none" stroke="#fde68a" stroke-width="1.5"/>
    <!-- lightning icon -->
    <path d="M73 268 l-5 9 h4 l-3 9 l8-11 h-4 Z" fill="#f59e0b"/>
    <text x="88" y="280" font-size="10" font-weight="700" fill="#d97706" letter-spacing="0.5">REAL-TIME</text>
  </g>

  <!-- ══════════════════════════════════════════
       SIDE LABELS (right)
  ══════════════════════════════════════════ -->
  <!-- ZERO-DEFECT -->
  <g>
    <rect x="726" y="224" width="118" height="28" rx="14" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <!-- code icon: &lt;/&gt; -->
    <text x="738" y="241" font-size="10" font-weight="700" fill="#7c3aed" font-family="monospace">&lt;/&gt;</text>
    <text x="758" y="241" font-size="10" font-weight="700" fill="#7c3aed" letter-spacing="0.5">ZERO-DEFECT</text>
  </g>
  <!-- PRODUCTION -->
  <g>
    <rect x="726" y="262" width="112" height="28" rx="14" fill="none" stroke="#f9a8d4" stroke-width="1.5"/>
    <!-- sparkle icon -->
    <text x="738" y="280" font-size="12" fill="#db2777">✦</text>
    <text x="754" y="280" font-size="10" font-weight="700" fill="#db2777" letter-spacing="0.5">PRODUCTION</text>
  </g>

  <!-- ══════════════════════════════════════════
       CENTER — CMS CORE ENGINE HUB
  ══════════════════════════════════════════ -->
  <!-- Outer glow ring -->
  <rect x="386" y="196" width="108" height="108" rx="26" fill="#3b82f6" opacity="0.10"/>
  <!-- Main cube card -->
  <g filter="url(#cubeShadow)">
    <rect x="392" y="200" width="96" height="100" rx="22" fill="url(#cubeGrad)"/>
    <rect x="392" y="200" width="96" height="100" rx="22" fill="url(#cubeShine)"/>
  </g>

  <!-- Layers / stack icon (3 stacked rectangles) -->
  <rect x="424" y="218" width="32" height="6"  rx="3" fill="white" opacity="0.90"/>
  <rect x="421" y="228" width="38" height="6"  rx="3" fill="white" opacity="0.70"/>
  <rect x="418" y="238" width="44" height="6"  rx="3" fill="white" opacity="0.50"/>

  <!-- CMS CORE label -->
  <text x="440" y="262" text-anchor="middle" font-size="11" font-weight="800" fill="white" letter-spacing="1.5">CMS CORE</text>

  <!-- Pulse underline / divider -->
  <line x1="415" y1="267" x2="465" y2="267" stroke="#7dd3fc" stroke-width="1.2" opacity="0.7"/>

  <!-- ENGINE HUB label -->
  <text x="440" y="281" text-anchor="middle" font-size="9" font-weight="600" fill="#93c5fd" letter-spacing="1.2">ENGINE HUB</text>

  <!-- Animated pulse dot on underline -->
  <circle cx="434" cy="267" r="3" fill="#38bdf8" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r"       values="3;4.5;3"     dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>
